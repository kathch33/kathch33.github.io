# Custom layouts live in /layouts. There is no theme and no theme submodule.
baseURL: https://kathch33.github.io/
locale: en-us
title: Katherine Cheng
enableRobotsTXT: true
enableGitInfo: true
disableKinds:
  - taxonomy
  - term

minify:
  tdewolff:
    html:
      keepComments: true

params:
  description: I bridge science and business and translate innovations into market impact.
  author: Katherine Cheng
  # FormSubmit AJAX URL. Placeholder until the alias from activation replaces it.
  # Do not put an email address here. See AGENTS.md.
  contactFormEndpoint: https://formsubmit.co/ajax/REPLACE_WITH_FORMSUBMIT_ALIAS
  # Intro call booking page. Leave empty until a Calendly or Google appointment link is ready.
  # When set, the intro call button opens this URL. When empty, the button scrolls to the contact form.
  introCallURL: ""

permalinks:
  writing: /writing/:slug/

caches:
  images:
    dir: :cacheDir/images

markup:
  goldmark:
    renderer:
      unsafe: true

outputs:
  home: [HTML, RSS]
  section: [HTML, RSS]
  page: [HTML]

# Custom layouts live in /layouts. There is no theme and no theme submodule.
baseURL: https://kathch33.github.io/
locale: en-us
title: Katherine Cheng
enableRobotsTXT: true
enableGitInfo: true
disableKinds:
  - taxonomy
  - term

minify:
  tdewolff:
    html:
      keepComments: true

params:
  description: A lab result needs a partner. Katherine Cheng works with scientists, hospitals and universities, and pharma, biotech, and investors.
  author: Katherine Cheng
  # FormSubmit AJAX URL. Placeholder until the alias from activation replaces it.
  # Do not put an email address here. See AGENTS.md.
  contactFormEndpoint: https://formsubmit.co/ajax/REPLACE_WITH_FORMSUBMIT_ALIAS

permalinks:
  writing: /writing/:slug/

caches:
  images:
    dir: :cacheDir/images

markup:
  goldmark:
    renderer:
      unsafe: true

outputs:
  home: [HTML, RSS]
  section: [HTML, RSS]
  page: [HTML]

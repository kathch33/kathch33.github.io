<section class="audience-notes" aria-labelledby="audience-notes-title">
  <h2 id="audience-notes-title">Who this is for</h2>
  {{- range hugo.Data.audiences }}
  <section class="audience-note" id="{{ .id }}" aria-labelledby="note-{{ .id }}">
    <h3 id="note-{{ .id }}">{{ .title }}</h3>
    {{- with .context }}
    <p class="context">{{ . }}</p>
    {{- end }}
    <p class="quote">{{ .text }}</p>
  </section>
  {{- end }}
</section>

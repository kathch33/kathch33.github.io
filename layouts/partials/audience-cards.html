<ul class="audiences">
  {{- range hugo.Data.audiences }}
  <li>
    <article class="audience" aria-labelledby="audience-{{ .id }}">
      <h3 id="audience-{{ .id }}">{{ .title }}</h3>
      {{- with .context }}
      <p class="context">{{ . }}</p>
      {{- end }}
      <p class="quote">{{ .text }}</p>
      <a href="{{ "about/" | relURL }}#{{ .id }}">For {{ .title | lower }}</a>
    </article>
  </li>
  {{- end }}
</ul>

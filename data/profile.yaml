work:
  eyebrow: "Selected work"
  heading_before: "Selected"
  heading_em: "work"
  cases:
    - number: "01"
      title: "Individualized neoantigen therapy"
      problem: "A cancer therapy built around one patient's antigens does not fit a standard product pitch."
      done: "Katherine Cheng worked in business development for Moderna's individualized neoantigen therapy in oncology from 2021 to 2026."
      mattered: "The Moderna program had both the science and the commercial work."
    - number: "02"
      title: "Biopharma strategy"
      problem: "A biopharma asset can lack a commercial plan. An acquisition can lack due diligence."
      done: "Katherine Cheng was Project Leader in the Healthcare Practice at Boston Consulting Group from 2014 to 2021. She worked on commercial plans and due diligence for acquisitions."
      mattered: "The decision had a commercial plan and due diligence."
    - number: "03"
      title: "A therapeutic human papillomavirus vaccine"
      problem: "A therapeutic vaccine needed a partner, and the scientists needed an investor presentation."
      done: "Katherine Cheng prepared an investor presentation for a therapeutic human papillomavirus vaccine at the Pennsylvania Small Business Development Center from 2011 to 2013."
      mattered: "The presentation led to a license with a biotech."
    - number: "04"
      title: "A gene therapy business plan"
      problem: "A gene therapy program in a university lab needed a company."
      done: "Katherine Cheng wrote the business plan for a Defense Advanced Research Projects Agency-funded adeno-associated virus gene therapy program. She wrote it in the Dr. Jim Wilson Lab at Penn Medicine from 2013 to 2014."
      mattered: "The program is now REGENXBIO."

help:
  eyebrow: "Who it is for"
  heading_before: "Who this is"
  heading_em: "for"
  label: "How I help"
  audiences:
    - number: "01"
      title: "Scientists"
      pain: "The patent isn't the finish line. It's the start of a conversation nobody trained you for."
      points:
        - "I write the market story and the investor story."
        - "I place the work in a buyer's portfolio."
        - "I prepare the plan for a license or a company."
    - number: "02"
      title: "Tech transfer offices"
      note: "Universities and hospitals"
      pain: "You're judged on revenue but staffed for paperwork. The hidden gems were never your fault."
      points:
        - "I tell you which disclosures a partner would want."
        - "I describe the asset in the language pharma business development uses."
        - "I set the structure for the partnering conversation."
    - number: "03"
      title: "Pharma and investors"
      note: "External innovation and family offices"
      pain: "The best assets rarely show up in a pitch deck. They're still waiting for someone to ask."
      points:
        - "I bring academic science before there is a pitch."
        - "I run due diligence and commercial plans."
        - "I work in English and in Mandarin."


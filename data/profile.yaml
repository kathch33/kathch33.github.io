  heading_em: "work"
  paragraphs:
    - "I have 16 years of deep domain expertise in biology and life sciences, and I work with high AI agency. That work has covered biotech, life sciences, finance, biology, AI, pharma operations, next-generation sequencing, and personalized medicine."
    - "I believe human-led agentic AI will create more opportunities in life sciences. It increases the flow of information and makes markets more efficient. It gives people more room to create."

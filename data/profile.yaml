work:
  eyebrow: "Selected work"
  heading_before: "Selected"
  heading_em: "work"
  cases:
    - number: "01"
      title: "Individualized neoantigen therapy"
      problem: "A cancer therapy built around one patient's antigens does not fit a standard product pitch."
      done: "Katherine Cheng worked in business development for Moderna's individualized neoantigen therapy in oncology."
      mattered: "The Moderna program had both the science and the commercial work."
    - number: "02"
      title: "Biopharma strategy"
      problem: "A biopharma asset can lack a commercial plan. An acquisition can lack due diligence."
      done: "Katherine Cheng was Project Leader in the Healthcare Practice at Boston Consulting Group. She worked on commercial plans and the review of acquisitions."
      mattered: "The decision had a commercial plan and due diligence."
    - number: "03"
      title: "A therapeutic human papillomavirus vaccine"
      problem: "A therapeutic vaccine needed a partner, and the scientists needed an investor presentation."
      done: "Katherine Cheng prepared an investor presentation for a therapeutic human papillomavirus vaccine at the Pennsylvania Small Business Development Center."
      mattered: "The presentation led to a license with a biotech."

help:
  eyebrow: "Who it is for"
  heading_before: "Who this is"
  heading_em: "for"
  label: "How I help"
  audiences:
    - number: "01"
      title: "Scientists"
      pain: "You have a promising result and a grant deadline, and you do not know who would license it."
      points:
        - "I help you explain the market story and the funder story."
        - "I tell you who would license it, and why."
        - "I help you walk into that conversation ready."
    - number: "02"
      title: "Tech transfer offices"
      note: "Universities and hospitals"
      pain: "You have a pile of disclosures on your desk, and a revenue target to hit this year."
      points:
        - "I tell you which ones a partner would want."
        - "I describe them in words a partner already uses."
        - "I help you set up the meeting with a clear ask."
    - number: "03"
      title: "Pharma and investors"
      note: "External innovation and family offices"
      pain: "You need an asset your competitors have not found yet."
      points:
        - "I bring you science from universities and hospitals before it is a pitch."
        - "I tell you what is worth your time."
        - "I help you test the science and the business case, in English or in Mandarin."
    - number: "04"
      title: "Life sciences teams"
      note: "Research, tech transfer, business development, and investors"
      wide: true
      pain: "Your team is buried in manual work. The same searches, summaries, and updates take the day."
      points:
        - "I help you set up AI agents for the repetitive work."
        - "Your people keep the judgment and the relationships."
        - "The agents do the repetitive tasks you already do."


help:
  eyebrow: "Who it is for"
  heading_before: "Who this is"
  heading_em: "for"
  label: "How I help"
  audiences:
    - number: "01"
      title: "Scientists"
      pain: "You have a promising result and a grant deadline, and you do not know who would license it."
      help: "You walk into the grant and the licensing conversation knowing who wants it and why."
    - number: "02"
      title: "Tech transfer offices"
      note: "Universities and hospitals"
      pain: "You have a pile of disclosures on your desk, and a revenue target to hit this year."
      help: "You know which disclosures a partner wants, and you walk into the meeting with a clear ask."
    - number: "03"
      title: "Pharma and investors"
      note: "External innovation and family offices"
      pain: "You need an asset your competitors have not found yet."
      help: "You see university and hospital science before it is a pitch, and you know what is worth your time."
    - number: "04"
      title: "Life sciences teams"
      note: "Research, tech transfer, business development, and investors"
      wide: true
      pain: "Your team is buried in manual work. The same searches, summaries, and updates take the day."
      help: "Your people keep the judgment and the relationships, and agents take the searches, summaries, and updates."


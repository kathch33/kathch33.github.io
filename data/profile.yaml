work:
  eyebrow: "Selected work"
  heading_before: "Selected"
  heading_em: "work"
  cases:
    - number: "01"
      title: "Individualized neoantigen therapy"
      seat: "I worked in business development in oncology at Moderna from 2021 to 2026."
      text: "I left to build."
    - number: "02"
      title: "Biopharma strategy"
      seat: "I was Project Leader in the Healthcare Practice at Boston Consulting Group from 2014 to 2021."
      text: "I led project work on healthcare and biopharma strategy, including commercial plans and due diligence for acquisitions."
    - number: "03"
      title: "A therapeutic human papillomavirus vaccine"
      seat: "I worked at the Pennsylvania Small Business Development Center from 2011 to 2013."
      text: "An investor presentation I prepared for a therapeutic human papillomavirus vaccine led to a license with a biotech."
    - number: "04"
      title: "Gene therapy, from the lab to a company"
      seat: "I worked in the Dr. Jim Wilson Lab at Penn Medicine from 2013 to 2014."
      text: "I wrote the business plan for an adeno-associated virus gene therapy program. The Defense Advanced Research Projects Agency funded the program. The program is now REGENXBIO."

help:
  eyebrow: "How I can help"
  heading_before: "How I can"
  heading_em: "help"
  audiences:
    - number: "01"
      title: "Scientists"
      line: "I turn a finding into something a buyer can act on."
      points:
        - "I write the market story and the investor story."
        - "I place the work in a buyer's portfolio."
        - "I prepare the path to a license or a new company."
    - number: "02"
      title: "Hospitals and universities"
      line: "I sort disclosures by whether they can support a deal."
      points:
        - "I help identify which assets are worth a partner's time."
        - "I describe an asset in the language pharma business development uses."
        - "I help set the structure for the partnering conversation."
    - number: "03"
      title: "Pharma, biotech, and investors"
      line: "I bring academic science before it is a pitch."
      points:
        - "I bring academic and hospital science that I have already sorted."
        - "I run due diligence and commercial plans in biopharma."
        - "I work in English and in Mandarin."


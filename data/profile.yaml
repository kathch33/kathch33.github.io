  audiences:
    - number: "01"
      title: "Scientists"
      context: ""
      points:
        - "I translate the science into a market story and an investor story."
        - "I show where the work fits in a buyer's portfolio."
        - "I prepare you for a licensing conversation, and for forming a company."
        - "I have done this with scientists at Penn Medicine and the Wistar Institute."
        - "In Dr. Jim Wilson's lab, I wrote the business plan for a company around a DARPA-funded adeno-associated virus gene therapy program, now REGENXBIO. The plan covered trial design, positioning from physician interviews, an investor thesis, a valuation, and a pitch to more than 200 experts and executives."
    - number: "02"
      title: "Hospitals and universities"
      context: "Tech transfer"
      points:
        - "I triage disclosures by commercial potential and position the ones that can support a deal."
        - "I frame an asset in the language pharma business development uses when it buys."
        - "I help with partnering strategy and with the outreach that follows."
        - "I structure deals. That comes from business development at Moderna, including Individualized Neoantigen Therapy, INT, in oncology."
        - "I know the academic side of the transfer from the lab to a partner. That comes from the Wilson lab and from advising scientists at Penn Medicine and the Wistar Institute."
    - number: "03"
      title: "Pharma, biotech, and investors"
      context: ""
      points:
        - "I can bring academic and hospital innovation early, already filtered."
        - "At BCG I did due diligence on 20 biotech companies for an acquisition-driven portfolio expansion, with a total shareholder return model."
        - "With Dr. Andrew Lo at MIT, I wrote on a portfolio approach to therapeutic innovation in ovarian cancer, published in the Journal of Investment Management in 2019."
        - "I work in English and Mandarin. An investor presentation I prepared for a therapeutic human papillomavirus vaccine led to a license with a Chinese biotech."
        - "Inside the companies, I wrote a five-year commercial plan for a top global influenza vaccine company. I managed a deal budget of more than $250 million at Moderna Therapeutics."

